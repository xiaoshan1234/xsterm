[package]
name = "xsterm"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "xsterm"

[lib]
name = "xsterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Elevated (run-as-admin) shell helper: launched via ShellExecuteEx("runas"),
# owns the ConPTY for elevated sessions and bridges it over a named pipe.
[[bin]]
name = "xsterm-elevated-helper"
path = "src/elevated_helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.50.0-beta.7"
russh-keys = "0.50.0-beta.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
mockall = "0.12"
mockall_derive = "0.12"
